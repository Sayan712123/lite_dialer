name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.example --project-name lite_dialer tmp_app
          cp -r tmp_app/android android
          rm -rf tmp_app

      - name: Add native dialer code
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/lite_dialer
          mkdir -p android/app/src/main/res/drawable
          find android/app/src/main \( -name MainActivity.kt -o -name MainActivity.java \) -delete
          cp native/Dialer.kt android/app/src/main/kotlin/com/example/lite_dialer/Dialer.kt
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp native/ic_dialer.xml android/app/src/main/res/drawable/ic_dialer.xml

      - name: Configure gradle
        run: |
          F=android/app/build.gradle.kts
          if [ -f "$F" ]; then
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' $F
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' $F
            sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' $F
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> $F
          else
            F=android/app/build.gradle
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' $F
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' $F
            sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' $F
            printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n' >> $F
          fi

      - run: flutter pub get

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: lite-dialer-apk
          path: build/app/outputs/flutter-apk/*.apk
