name: lite_dialer
description: A HyperOS-style dialer with recents, contacts and a T9 keypad.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_phone_direct_caller: ^2.1.1
  flutter_contacts: ^1.1.9
  call_log: ^5.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5

flutter:
  uses-material-design: true
